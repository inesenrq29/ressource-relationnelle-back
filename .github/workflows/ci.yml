name: CI Back

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Build and test backend
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11

        env:
          MARIADB_ROOT_PASSWORD: ci_root_password
          MARIADB_DATABASE: rr_test
          MARIADB_USER: rr_ci
          MARIADB_PASSWORD: ci_password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u rr_ci -pci_password --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      # chargement d'application-prod.yaml
      SPRING_PROFILES_ACTIVE: prod

      # base temporaire créée uniquement pour la CI
      DB_URL: jdbc:mariadb://localhost:3306/rr_test
      DB_USERNAME: rr_ci
      DB_PASSWORD: ci_password

      # fausse clé réservée à la CI
      JWT_SECRET: ci-jwt-secret-long-and-secure-with-at-least-32-characters

      SERVER_PORT: 8080

    steps:
      # récupération du dépôt back
      - name: Retrieve repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # historique Git
          fetch-depth: 0

      # installation de la même version de Java que dans le pom
      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      # autorisation d’exécuter le Maven Wrapper
      - name: Authorize Maven Wrapper
        run: chmod +x mvnw

      # compilation, tests et génération du rapport JaCoCo
      - name: Build and test backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

      # analyse Sonar sauf pour les PR de Dependabot
      - name: Analyze backend with SonarQube Cloud
        if: >-
          github.actor != 'dependabot[bot]'
          && (github.event_name == 'pull_request'
          || github.ref == 'refs/heads/master')
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw --batch-mode --no-transfer-progress
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=inesenrq29_ressource-relationnelle-back

      # préparation de la construction Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      # connexion à GHCR que sur la branche principale
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # construction de l’image sur toutes les branches,
      # mais publication que depuis master
      - name: Build and publish backend Docker image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: .
          file: ./Dockerfile

          push: >-
            ${{ github.event_name == 'push'
            && github.ref == 'refs/heads/master' }}

          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}