spring:
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3307/rrDb}
    username: ${DB_USERNAME:rruser}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

security:
  refresh-cookie:
    secure: false
    same-site: Lax
    path: /api/auth
  jwt:
    secret: ${JWT_SECRET}

server:
  port: ${SERVER_PORT:8080}